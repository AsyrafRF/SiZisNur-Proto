		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

function shell(){let u=user(),p=PAGES[state.page];if(!can(state.page))state.page='dashboard';p=PAGES[state.page];return `<div class="shell">${nav()}<div class="workspace"><header class="topbar"><div class="actions"><button class="btn sm mobile-menu" data-action="toggle-menu">☰</button><div><div class="crumb">${e(tenant().name)} / ${e(p[0])}</div><h1>${e(p[0])}</h1></div></div><div class="top-actions"><button class="btn sm" data-action="theme">◐ Tema</button><button class="btn sm" data-action="public">◉ Publik</button><span class="userpill"><span class="avatar">${e(u.name.charAt(0))}</span><span>${e(u.name)}<br><b>${e(u.role)}</b></span></span><button class="btn sm" data-action="logout">Keluar</button></div></header><main class="content" id="main-content">${renderPage()}</main><div class="app-footer">${e(DEMO_CAVEAT)}</div></div></div><div id="modal-root"></div>`}
function render(){document.body.classList.toggle('dark',localStorage.getItem('azis_theme')==='dark');const root=document.getElementById('app');if(!user()){if(session)logout();root.innerHTML=loginView();return}if(state.page==='public'){root.innerHTML=publicView(true)+'<div id="modal-root"></div>';renderModal();return}root.innerHTML=shell();renderModal();}
function loginView(){return `<div class="auth"><section class="auth-art"><div class="eyebrow">Prototype • Masjid An-Nur VPA Batam</div><h1>Pengelolaan zakat, <br>lebih <em>tertata.</em></h1><p>Uji alur pembayaran, verifikasi bendahara, penilaian mustahik, perhitungan alokasi, persetujuan pengurus, dan penyaluran zakat dalam satu simulasi terintegrasi.</p><div class="pill">100% HTML + CSS + JavaScript • Berjalan offline</div><div class="login-hero-list"><div>✓ Seluruh angka dan identitas adalah data fiktif.</div><div>✓ Ganti peran untuk menguji proses lintas panitia.</div><div>✓ Reset skenario demo kapan saja.</div></div></section><section class="auth-main"><div class="auth-box"><span class="tag info">LINGKUNGAN SIMULASI</span><h2>Masuk ke demo aplikasi</h2><p>Pilih akun contoh sesuai panitia untuk melihat tampilan dan hak akses setiap peran. Tidak memakai password sungguhan.</p><div class="demo-roles">${db.users.filter(u=>u.tenantId==='TN-ANNUR'&&u.id!=='US-AML2').map(u=>`<button class="role-tile" data-action="quick-login" data-id="${u.id}"><b>${e(u.role)}</b><small>${e(u.name)} · Masjid An-Nur</small></button>`).join('')}</div><form data-form="login"><div class="grid-form">${sel('Akun demonstrasi','account',db.users.filter(u=>u.active).map(u=>[u.id,u.name+' — '+u.role+' ('+u.tenantId+')']))}<div class="field"><label>Opsi sesi</label><label class="check"><input type="checkbox" name="remember"> Ingat saya di perangkat ini</label></div></div>${frmBtn('Masuk ke dashboard')}</form><p class="caption">Mode publik: ${btn('Lihat statistik & verifikasi struk','public','sm')} &nbsp; ${btn('Ajukan lembaga demo','tenant-apply','sm')} &nbsp; ${btn('Simulasi verifikasi platform','platform','sm')}</p><div class="alert warn">${DEMO_CAVEAT}</div></div></section></div><div id="modal-root"></div>`}
function renderPage(){try{switch(state.page){case'dashboard':return dashboard();case'tenant':return tenantPage();case'users':return usersPage();case'periods':return periodsPage();case'settings':return settingsPage();case'schedule':return schedulePage();case'muzakki':return muzakkiPage();case'transactions':return transactionsPage();case'deposits':return depositsPage();case'mustahik':return mustahikPage();case'allocation':return allocationPage();case'distribution':return distributionPage();case'incentives':return incentivesPage();case'reports':return reportsPage();case'notifications':return notificationsPage();case'audit':return auditPage();case'help':return helpPage();default:return dashboard()}}catch(err){console.error(err);return `<div class="alert danger">Kesalahan tampilan: ${e(err.message)}</div>`}}
function transactionTotals(t){return {money:sum(t.lines.filter(x=>x.type==='uang'),'value'),rice:sum(t.lines.filter(x=>x.type==='beras'),'value')}}
function metrics(){let p=activePeriod()||scoped('periods')[0],t=scoped('transactions').filter(x=>x.periodId===p?.id&&x.status!=='batal'),v=t.filter(x=>x.status==='terverifikasi'),a=scoped('allocations').filter(x=>x.periodId===p?.id&&x.status==='disetujui'),d=scoped('distributions').filter(x=>x.periodId===p?.id&&x.status==='tersalurkan');return {p,t,v,a,d,received:sum(t,x=>transactionTotals(x).money),rice:sum(t,x=>transactionTotals(x).rice),verified:sum(v,x=>transactionTotals(x).money),verifiedRice:sum(v,x=>transactionTotals(x).rice),allocated:sum(a,x=>sum(x.items,'money')),allocatedRice:sum(a,x=>sum(x.items,'rice')),sent:sum(d,'money'),sentRice:sum(d,'rice'),jiwa:sum(t,'jiwa'),people:new Set(t.map(x=>x.personId)).size}}
function dashboard(){const m=metrics(),t=m.t.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));let cats=CATEGORIES.map(cat=>({name:cat,value:sum(m.t,x=>sum(x.lines.filter(l=>l.category===cat&&l.type==='uang'),'value'))})),max=Math.max(1,...cats.map(x=>x.value));return `${boxhead('Ringkasan Pengelolaan Zakat',`Periode ${e(m.p?.name||'belum dibuka')} • Peran: ${e(user().role)}. Data berubah sesuai simulasi transaksi dan verifikasi.`,btn('▶ Panduan alur demo','guided','primary'))}<div class="hero"><div><h2>Assalamu’alaikum, ${e(user().name.split(' ')[0])} 👋</h2><p>Semua modul pada prototype terhubung menggunakan data lokal yang sama.<br> Lanjutkan proses sesuai kewenangan role, lalu lihat perubahan ringkasan secara langsung.</p></div>${btn(can('reports')?'Lihat laporan':'Mulai simulasi',can('reports')?'navigate':'guided','',can('reports')?'data-page="reports"':'')}</div><div class="cards">${stat('Penerimaan uang tercatat',rup(m.received),'Belum tentu seluruhnya terverifikasi','◈')}${stat('Penerimaan beras',kg(m.rice),'Pisah dari kas uang','▥')}${stat('Total muzakki',m.people+' orang',m.jiwa+' jiwa dibayarkan','♙')}${stat('Terverifikasi bendahara',rup(m.verified),'Beras: '+kg(m.verifiedRice),'✓')}</div><div class="two-col"><div class="card"><div class="card-top"><h3>Penerimaan per kategori (uang)</h3>${tag('aktif')}</div>${cats.map(c=>`<div class="bar-row"><label>${e(c.name)}</label><div class="bar"><i style="width:${Math.max(0,c.value/max*100)}%"></i></div><b>${rup(c.value)}</b></div>`).join('')}<p class="caption">Penerimaan beras dicatat terpisah dan tidak dijumlahkan sebagai rupiah.</p></div><div class="card"><h3>Status distribusi</h3><div class="mini-list"><div class="mini-item"><span>Dana terverifikasi</span><b>${rup(m.verified)}</b></div><div class="mini-item"><span>Rencana disetujui</span><b>${rup(m.allocated)}</b></div><div class="mini-item"><span>Realisasi penyaluran</span><b>${rup(m.sent)}</b></div><div class="mini-item"><span>Sisa dana terverifikasi *</span><b>${rup(m.verified-m.sent)}</b></div><div class="mini-item"><span>Mustahik diverifikasi</span><b>${scoped('mustahiks').filter(x=>x.status==='terverifikasi').length} orang</b></div></div><p class="caption">* Saldo sederhana demonstrasi. Pada sistem produksi harus memperhitungkan komitmen, penolakan, koreksi, dan pos dana secara terpisah.</p></div></div><div class="two-col"><section class="card"><div class="card-top"><h3>Transaksi terbaru</h3>${can('transactions')?btn('Buka modul','navigate','sm','data-page="transactions"'):''}</div>${table(['Nomor','Muzakki','Uang','Beras','Status'],t.slice(0,6).map(x=>[`<b class="mono">${e(x.serial)}</b>`,e(person(x.personId)?.name),rup(transactionTotals(x).money),kg(transactionTotals(x).rice),tag(x.status)]))}</section><section class="card"><h3>Perjalanan alur yang disimulasikan</h3><div class="steps">${[['1','Penerimaan'],['2','Setoran'],['3','Mustahik'],['4','Alokasi'],['5','Distribusi']].map(([n,v])=>`<div class="step"><strong>${n}</strong>${v}</div>`).join('')}</div><p class="caption">Pengurus menyetujui alokasi; Bendahara memvalidasi setoran; Petugas mengelola mustahik dan perencanaan. Untuk mencoba semua tahapan, gunakan login ulang sebagai tiap role.</p>${btn('Lihat daftar langkah uji coba','guided','primary')}</section></div>`}
function tenantPage(){return `${boxhead('Profil Lembaga & Tenant','Admin dan Pengurus dapat mengubah identitas masjid, tetapi akses antartenant dibatasi pada sesi pengguna.') }<div class="two-col"><div class="card"><h3>Identitas masjid</h3><form data-form="tenant"><div class="grid-form">${fld('Nama lembaga','name',tenant().name,'text','required')}${fld('Nomor telepon','phone',tenant().phone)}${fld('Email','email',tenant().email,'email')}${fld('Wilayah RT/RW','rt',tenant().rt)}${textarea('Alamat','address',tenant().address)}</div>${frmBtn('Simpan profil lembaga')}</form></div><div class="card"><h3>Konfigurasi tenant</h3><div class="mini-list"><div class="mini-item"><span>ID tenant</span><b class="mono">${e(tenantId())}</b></div><div class="mini-item"><span>Status</span>${tag(tenant().status)}</div><div class="mini-item"><span>Pengguna aktif</span><b>${scoped('users').filter(x=>x.active).length}</b></div><div class="mini-item"><span>Periode</span><b>${scoped('periods').length}</b></div></div><div class="alert light">Isolasi pada prototype hanya berupa filter JavaScript (bukan keamanan server). Tenant B tersedia sebagai contoh untuk pemeriksaan pemisahan antarmuka.</div></div></div>`}
function usersPage(){return `${boxhead('Manajemen Akun & Role','Admin hanya mengelola akun dalam tenant yang aktif. Otorisasi ini merupakan simulasi UI.',btn('Tambah pengguna','user-new','primary'))}<div class="card">${table(['Pengguna','Email','Peran','Status','Aksi'],scoped('users').map(u=>[`<b>${e(u.name)}</b><div class="tiny mono">${e(u.id)}</div>`,e(u.email),tag(u.role),tag(u.active?'aktif':'nonaktif'),`${btn('Edit','user-edit','sm',`data-id="${u.id}"`)} ${u.id!==user().id?btn(u.active?'Nonaktifkan':'Aktifkan','user-toggle','sm',`data-id="${u.id}"`):''}`]))}</div>`}
function userModal(u){modal(u?'Edit akun':'Tambah pengguna',`<form data-form="user" data-id="${e(u?.id||'')}"><div class="grid-form">${fld('Nama lengkap *','name',u?.name||'','text','required')}${fld('Alamat email *','email',u?.email||'','email','required')}${sel('Peran','role',ROLES.map(r=>[r,r]),u?.role||'Amilin')}</div><div class="alert light">Akun hanya akun demo tanpa password. Tidak ada autentikasi sesungguhnya.</div>${frmBtn()}</form>`)}
function periodsPage(){const ps=scoped('periods');return `${boxhead('Periode Pengelolaan Zakat','Hanya satu periode aktif per tenant. Arsip bersifat baca-saja secara konsep.',btn('Buat periode baru','period-new','primary'))}<div class="card">${table(['Periode','Dibuka','Ditutup','Status','Tindakan'],ps.map(p=>[`<b>${e(p.name)}</b><div class="tiny mono">${e(p.id)}</div>`,prettyDate(p.openedAt),prettyDate(p.closedAt),tag(p.status),p.status==='aktif'?btn('Tutup & arsipkan','period-close','sm danger',`data-id="${p.id}"`):p.status==='draf'?btn('Aktifkan','period-open','sm primary',`data-id="${p.id}"`):'<span class="muted">Arsip historis</span>']))}</div><div class="alert warn">Penutupan akan ditolak apabila masih terdapat setoran belum diverifikasi atau rencana alokasi menunggu persetujuan. Data tetap tersimpan untuk pelacakan; penghapusan otomatis 5–6 tahun tidak dieksekusi di prototype.</div>`}
function settingsPage(){const r=rule();return `${boxhead('Tarif & Konfigurasi Perhitungan','Parameter dinamis per tenant. Skor fakir/miskin dan insentif masih memerlukan keputusan pengurus.')}<div class="two-col"><section class="card"><h3>Tarif dan pengaturan nominal</h3><form data-form="rules"><div class="grid-form">${fld('Tarif zakat fitrah / jiwa (Rp)','moneyRate',r.moneyRate,'number','min="1" required')}${fld('Beras zakat fitrah / jiwa (kg)','riceRate',r.riceRate,'number','min="0.1" step="0.1" required')}${sel('Kelipatan pembulatan alokasi (Rp)','rounding',[[1000,'Rp 1.000'],[10000,'Rp 10.000'],[50000,'Rp 50.000'],[100000,'Rp 100.000']],r.rounding)}${fld('Total insentif contoh (Rp)','monthlyIncentive',r.monthlyIncentive,'number','min="0"')}${fld('Bobot fakir (%)','fakir',r.weights.fakir,'number','min="0" max="100"')}${fld('Bobot miskin (%)','miskin',r.weights.miskin,'number','min="0" max="100"')}${fld('Bobot mualaf (%)','mualaf',r.weights.mualaf,'number','min="0" max="100"')}${fld('Ambang skor fakultatif','scoreThreshold',r.scoreThreshold??'','number','min="0" placeholder="Belum disahkan"')}${textarea('Sumber/keputusan aturan','source',r.source)}</div>${frmBtn('Simpan parameter demo')}</form></section><section class="card"><h3>Aturan bisnis yang perlu validasi</h3><div class="alert warn">Nilai tarif, bobot, batas skor, dan insentif pada contoh **tidak mewakili keputusan resmi** panitia, BAZNAS, atau syariat.</div><div class="mini-list"><div class="mini-item"><span>Bobot alokasi</span><b>${r.weights.fakir+r.weights.miskin+r.weights.mualaf}%</b></div><div class="mini-item"><span>Skor fakir/miskin</span><b>${r.scoreThreshold??'Belum ditetapkan'}</b></div><div class="mini-item"><span>Metode insentif</span><b>Contoh</b></div></div><p class="caption">Observasi menyebut ambang lebih dari 360 dan minimal 375. Karena berbeda, prototype tidak otomatis mengubah skor menjadi kategori final; petugas memutuskan klasifikasi secara eksplisit.</p><p class="caption">Jika alokasi diubah, rencana yang telah disetujui tidak otomatis dihitung ulang; informasi historis tetap menggunakan nominal yang disetujui.</p></section></div>`}
function schedulePage(){const s=scoped('schedule'),ptg=scoped('users').filter(x=>x.role==='Amilin');return `${boxhead('Jadwal & Kehadiran Amilin','Jadwal, kehadiran, dan petugas pengganti menjadi dasar rekam kontribusi.',can('periods')?btn('Tambah jadwal','schedule-new','primary'):'')}<div class="card">${table(['Tanggal','Shift','Amilin dijadwalkan','Pengganti','Kehadiran','Tindakan'],s.map(j=>[prettyDate(j.date),e(j.shift),e(who(j.amilId)),e(j.substituteId?who(j.substituteId):'—'),tag(j.attendance),user().role==='Petugas'?btn('Ubah catatan','schedule-edit','sm',`data-id="${j.id}"`):'—']))}</div><div class="alert light">Simulasi insentif memperlihatkan kontribusi berdasarkan kehadiran dan jiwa yang dilayani. Rumus resmi harus ditetapkan sebelum digunakan.</div>`}
function scheduleModal(j){modal(j?'Ubah kehadiran dan penggantian':'Tambah jadwal',`<form data-form="schedule" data-id="${e(j?.id||'')}"><div class="grid-form">${fld('Tanggal','date',j?.date||today(),'date','required')}${fld('Jam tugas','shift',j?.shift||'08.00–12.00','text','required')}${sel('Amilin','amilId',scoped('users').filter(x=>x.role==='Amilin'&&x.active).map(x=>[x.id,x.name]),j?.amilId)}${sel('Petugas pengganti','substituteId',[['','Tidak ada'],...scoped('users').filter(x=>x.role==='Amilin'&&x.active).map(x=>[x.id,x.name])],j?.substituteId||'')}${sel('Status hadir','attendance',['belum','hadir','tidak_hadir','digantikan'],j?.attendance||'belum')}</div>${frmBtn()}</form>`)}
function muzakkiPage(){const list=scoped('muzakki').map(m=>({...m,p:person(m.personId)})).filter(x=>x.p);return `${boxhead('Data Muzakki & Kartu Digital','Pencarian data lama, identitas kontak, kartu unik, serta histori transaksi dalam tenant.',btn('Tambah muzakki','muzakki-new','primary'))}<div class="card"><div class="card-top"><h3>Daftar muzakki (${list.length})</h3><input class="search" style="max-width:300px" id="search-muzakki" placeholder="Cari nama, HP, kode kartu…" value="${e(state.search)}" aria-label="Cari muzakki"></div><div id="muzakki-table">${muzakkiTable(list)}</div></div>`}
function muzakkiTable(list){let q=state.search.toLowerCase();const matches=list.filter(x=>(x.p.name+' '+x.p.phone+' '+x.cardCode).toLowerCase().includes(q));return table(['Nama / Kontak','Alamat','Kartu','Total transaksi','Aksi'],matches.map(x=>[`<b>${e(x.p.name)}</b><div class="tiny">${e(x.p.phone||x.p.email)}</div>`,e(x.p.address),`<span class="mono">${e(x.cardCode)}</span>`,scoped('transactions').filter(t=>t.personId===x.p.id&&t.status!=='batal').length,`${btn('Kartu','card','sm',`data-id="${x.id}"`)} ${btn('Riwayat','history','sm',`data-id="${x.p.id}"`)} ${btn('Edit','muzakki-edit','sm',`data-id="${x.id}"`)}`]))}
function muzakkiModal(m){let p=m?person(m.personId):null;modal(m?'Edit identitas muzakki':'Registrasi muzakki',`<form data-form="muzakki" data-id="${e(m?.id||'')}"><div class="grid-form">${fld('Nama lengkap *','name',p?.name||'','text','required')}${fld('Nomor HP (HP atau email wajib)','phone',p?.phone||'','tel')}${fld('Email (HP atau email wajib)','email',p?.email||'','email')}${fld('NIK (opsional, data fiktif saja)','nik',p?.nik||'','text')}${textarea('Alamat lengkap *','address',p?.address||'')}</div><div class="alert light">Demi privasi, gunakan identitas dummy untuk demo. Reader e-KTP tidak diaktifkan.</div>${frmBtn('Simpan muzakki')}</form>`)}
function moneyLine(c){return `<div class="line-row"><div class="field"><label>Kategori</label><select class="line-category">${CATEGORIES.map(o=>`<option ${o===c.category?'selected':''}>${e(o)}</option>`).join('')}</select></div><div class="field"><label>Jenis</label><select class="line-type"><option value="uang" ${c.type==='uang'?'selected':''}>Uang (Rp)</option><option value="beras" ${c.type==='beras'?'selected':''}>Beras (kg)</option></select></div><div class="field"><label>Nominal / kg</label><input class="line-value" type="number" min="0.01" step="any" value="${e(c.value)}" required></div>${btn('×','remove-line','danger sm')}</div>`}
function transactionsPage(){let ps=activePeriod(),ts=scoped('transactions').filter(t=>t.periodId===(ps?.id||'')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));return `${boxhead('Pencatatan Penerimaan Zakat','Penerimaan langsung oleh Amilin atau Operator, dilengkapi detail kategori uang/beras dan status bendahara.',user().role==='Bendahara'?'':btn('Transaksi baru','transaction-new','primary'))}${!ps?'<div class="alert danger">Tidak ada periode aktif; petugas harus membukanya terlebih dahulu.</div>':''}<div class="card"><div class="card-top"><h3>Transaksi periode aktif (${ts.length})</h3><div class="actions">${btn('Ekspor CSV','export-tx','sm')} ${btn('Lihat simulasi QR','public','sm')}</div></div>${table(['Nomor / ID','Muzakki','Petugas','Komponen','Jumlah uang','Beras','Status','Aksi'],ts.map(t=>[`<b class="mono">${e(t.serial)}</b><div class="tiny mono">${e(t.id)}</div>`,`<b>${e(person(t.personId)?.name)}</b><div class="tiny">${t.jiwa} jiwa</div>`,e(who(t.handledBy)),`<span class="tiny">${e(t.lines.map(x=>x.category).join(', '))}</span>`,rup(transactionTotals(t).money),kg(transactionTotals(t).rice),tag(t.status),`${btn('Struk / QR','receipt','sm',`data-id="${t.id}"`)} ${t.status==='tercatat'&&user().role!=='Bendahara'?btn('Batalkan','tx-cancel','sm danger',`data-id="${t.id}"`):''}`]))}</div>`}
function txModal(){const p=activePeriod();if(!p)return toast('Buka periode aktif terlebih dahulu','error');if(!state.lines?.length)state.lines=[{category:'Zakat Fitrah',type:'uang',value:''}];let mz=scoped('muzakki').map(x=>({...x,p:person(x.personId)}));let amil=scoped('users').filter(x=>x.role==='Amilin'&&x.active);return modal('Catat transaksi zakat',`<form id="tx-form" data-form="transaction"><div class="grid-form">${sel('Muzakki tersimpan','existing',[['','— Muzakki baru —'],...mz.map(x=>[x.personId,x.p?.name+' · '+x.cardCode])],'')}${fld('Cari menggunakan kode kartu','cardLookup','','text','placeholder="Masukkan ID kartu, lalu klik Cari"')}<div class="full">${btn('Cari kartu & muat identitas','lookup-card','sm')}</div>${fld('Nama muzakki *','name','','text','required')}${fld('HP (atau email)','phone','','tel')}${fld('Email (atau HP)','email','','email')}${fld('Jumlah jiwa *','jiwa',1,'number','min="1" required')}${textarea('Alamat muzakki *','address','')}</div><div class="grid-form" style="margin-top:12px">${sel('Amilin penerima','amilId',amil.map(x=>[x.id,x.name]),user().role==='Amilin'?user().id:amil[0]?.id)}${sel('Operator pencatat','operatorId',[['','Tidak ada'],...scoped('users').filter(x=>x.role==='Operator Zakat').map(x=>[x.id,x.name])],user().role==='Operator Zakat'?user().id:'')}</div><div class="card-top" style="margin-top:22px"><h3>Rincian pembayaran</h3>${btn('+ Tambah jenis','add-line','sm')}</div><div id="tx-lines" class="line-items">${state.lines.map(moneyLine).join('')}</div><label class="check" style="margin-top:12px"><input type="checkbox" name="autoExcess" checked> Jika ada kelebihan zakat fitrah, pisahkan sebagai infak/sedekah (sesuai media pembayaran)</label><div id="tx-preview"></div>${textarea('Keterangan / catatan (opsional)','note','')}<div class="alert light">Setelah disimpan: tampilkan akad pada layar kedua (simulasi), cetak 2 rangkap, kemudian disetor bendahara. Data belum berstatus terverifikasi sampai setoran cocok.</div>${frmBtn('Simpan transaksi & tampilkan akad')}</form>`,true),updateTxPreview()}

const housingPts={'Kost':100,'Kontrakan':75,'Menumpang':50,'Milik sendiri':25};
const maritalPts={'Cerai mati':100,'Cerai hidup':75,'Tidak menikah':25,'Menikah':25};
const depPts=n=>n>=4?100:n===3?75:n===2?50:n===1?25:0;
const incomePts=n=>n<1000000?100:n<2000000?80:n<3000000?60:n<4000000?40:n<5000000?20:0;

function allocGenerator(){let ms=scoped('mustahiks').filter(x=>x.status==='terverifikasi'),m=metrics(),available=Math.max(0,m.verified-m.allocated),riceAvail=Math.max(0,m.verifiedRice-m.allocatedRice);modal('Simulasi alokasi bertahap',`<form data-form="allocation"><div class="grid-form">${fld('Nama rencana alokasi','name','Tahap baru '+today(),'text','required')}${fld('Anggaran uang (Rp)','budget',available,'number','min="0" required')}${fld('Anggaran beras (kg)','riceBudget',riceAvail,'number','min="0" step="any" required')}${sel('Metode pembulatan','rounding',[[1,'Tanpa pembulatan'],[1000,'Rp 1.000'],[10000,'Rp 10.000'],[50000,'Rp 50.000'],[100000,'Rp 100.000']],1)}</div><div class="alert light">${ms.length} mustahik terverifikasi. Bobot asnaf saat ini: Fakir ${rule().weights.fakir}%, Miskin ${rule().weights.miskin}%, Mualaf ${rule().weights.mualaf}%. Saldo nonalokasi: ${rup(available)} dan ${kg(riceAvail)}.</div><div id="alloc-preview" class="section-gap"></div>${textarea('Catatan dasar pembagian','note','Simulasi untuk keperluan UAT; menunggu pengesahan rumus.')}${frmBtn('Simpan sebagai draf')}</form>`,true);updateAllocPreview()}

const a=b.dataset.action, key=b.dataset.id;
if(a!=='close-modal-bg')touch();
try{switch(a){
case'navigate':navigate(b.dataset.page);break;
case'toggle-menu':document.getElementById('side')?.classList.toggle('open');break;
case'theme':localStorage.setItem('azis_theme',localStorage.getItem('azis_theme')==='dark'?'light':'dark');render();break;
case'logout':logout();break;
case'quick-login':login(key,false);break;

case'distribution':{check('distribution');assertRole(['Petugas']);let [allocId,mustahikId]=d.choice.split('|'),a=scoped('allocations').find(x=>x.id===allocId);if(!a||a.status!=='disetujui')throw Error('Alokasi belum disetujui');let item=a.items.find(x=>x.mustahikId===mustahikId);if(!item)throw Error('Penerima tidak terdaftar pada alokasi');if(scoped('distributions').some(x=>x.allocationId===allocId&&x.mustahikId===mustahikId))throw Error('Penyaluran ganda pada item alokasi yang sama');db.distributions.push({id:id('DS'),tenantId:tenantId(),periodId:a.periodId,allocationId:a.id,mustahikId,money:item.money,rice:item.rice,status:'tersalurkan',deliveredAt:d.date+'T12:00:00',deliveredBy:user().id,note:d.note});aud('DISTRIBUSI','Salurkan '+a.id+' ke '+mustahikId+' uang '+item.money);break}
case'notification':{check('notifications');assertRole(['Admin','Petugas']);if(d.consent!=='yes')throw Error('Persetujuan penerima dibutuhkan untuk notifikasi non-transaksional');db.notifications.push({id:id('NT'),tenantId:tenantId(),personId:d.personId,channel:d.channel,subject:d.subject.trim(),status:'simulasi',date:today(),consent:true});aud('NOTIFIKASI','Antrian '+d.subject);break}
case'verify-public':{const holder=document.getElementById('verify-result');if(holder){holder.innerHTML=verifiedResult(d.token.trim());state.filters.verify=d.token.trim()}return}
} },{message:undefined,close:!['transaction','verify-public'].includes(f.dataset.form),render:!['transaction','verify-public'].includes(f.dataset.form)});
});
document.addEventListener('input',ev=>{let t=ev.target;if(t.id==='search-muzakki'){state.search=t.value;let xs=scoped('muzakki').map(m=>({...m,p:person(m.personId)})).filter(x=>x.p);let el=document.getElementById('muzakki-table');if(el)el.innerHTML=muzakkiTable(xs)}if(t.closest('#tx-form')&&(t.name==='jiwa'||t.classList.contains('line-value')))updateTxPreview();if(t.closest('[data-form="allocation"]')&&['budget','riceBudget'].includes(t.name))updateAllocPreview()});
document.addEventListener('change',ev=>{let t=ev.target;if(t.name==='existing'&&t.closest('#tx-form')){const p=person(t.value),f=t.form;if(p){for(let x of ['name','phone','email','address'])f.elements[x].value=p[x]||''}else{for(let x of ['name','phone','email','address'])f.elements[x].value=''}}if(t.closest('#tx-lines'))updateTxPreview();if(t.name==='amilId'&&t.closest('[data-form="deposit-new"]'))updateDepositEstimate();if(t.closest('[data-form="allocation"]')&&t.name==='rounding')updateAllocPreview()});
window.addEventListener('storage',ev=>{if(ev.key===DBKEY&&ev.newValue){let incoming=safeJSON(ev.newValue,null);if(incoming&&incoming.version===3){db=incoming;if(user())render()}}});
